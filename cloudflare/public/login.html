<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>GymMane</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --bg:#0A0A0A; --card:#161513; --fg:#F2EEE9; --muted:#9a948c; --line:#2a2825; --accent:#E8B04A; --err:#ff6b5e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f3ee; --card:#fff; --fg:#1b1916; --muted:#6c665e; --line:#e4ded5; --accent:#b97a0a; --err:#c0392b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:26px; letter-spacing:-.02em; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; font-size:16px; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:12px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:13px; font-size:16px; font-weight:700; color:#1b1916; background:var(--accent); border:0; border-radius:12px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { min-height:20px; margin-top:12px; color:var(--err); font-size:14px; }
  footer { margin-top:18px; text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>GymMane</h1>
  <p class="sub" id="sub">Sign in to continue</p>
  <form id="f" autocomplete="on">
    <label for="u" id="lu">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p" id="lp">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
  <footer>Based on GymMane by InlitX</footer>
</main>
<script src="/gm-login.js"></script>
</body>
</html>
