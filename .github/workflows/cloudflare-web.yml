name: GymMane web on Cloudflare

# Build + test run on every push/PR that touches the web app or the Worker.
# Deploy is manual (workflow_dispatch with deploy=true) and waits for approval of the
# "production" environment (set required reviewers in Settings > Environments).
on:
  pull_request:
    paths: ['lib/**', 'web/**', 'assets/**', 'pubspec.*', 'cloudflare/**', '.github/workflows/cloudflare-web.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'assets/**', 'pubspec.*', 'cloudflare/**', '.github/workflows/cloudflare-web.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare production (needs environment approval)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
        working-directory: cloudflare

  build-web:
    name: Flutter analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build web (WASM)
        run: flutter build web --wasm --release --no-web-resources-cdn --pwa-strategy=none
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Assemble Worker assets (web build + login page)
        run: node cloudflare/scripts/assemble.mjs build/web
      - uses: actions/upload-artifact@v4
        with:
          name: gymmane-dist
          path: cloudflare/dist
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [worker-tests, build-web]
    runs-on: ubuntu-latest
    environment: production   # required reviewers = your final approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: gymmane-dist
          path: cloudflare/dist
      - run: npm install --no-audit --no-fund
        working-directory: cloudflare
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply gymmane-db --remote
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set BOOTSTRAP_TOKEN secret on the Worker
        run: printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put BOOTSTRAP_TOKEN
        working-directory: cloudflare
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
